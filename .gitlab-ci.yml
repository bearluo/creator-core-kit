# creator-core-kit CI —— 六门：typecheck / build / test(coverage) / lint / channels / api-docs
#
# 铁律由 lint 强制执行（core 禁 import 'cc'，规则见 eslint.config.js / CLAUDE.md）。
# runner：hlgit 共享 docker runner（linux/amd64，run_untagged=true，故不加 tags）。
# node 22 而非 20：pnpm 11.3.0 在 node 20 上启动即崩（ERR_UNKNOWN_BUILTIN_MODULE）。
#
# 镜像走内网 Harbor 而不是 docker.io：**runner 没有公网**，直连 registry-1.docker.io
# 每次 30s 超时 ×2 后整个 job 失败（连 clone 都到不了）。基础镜像已搬运到
# harbor.5518game.com:6443/match/，与 remove-bg-api 等仓同一套路；拉取凭据是项目
# CI/CD Variable `DOCKER_AUTH_CONFIG`（match 只读 robot，不入库）。
# 换 node 版本要先把新 tag 推进 Harbor，否则同样拉不到。
#
# `-git` 后缀的镜像 = node:22-slim + git。协议契约 `@kit/proto` 是 **git 依赖**
# （kit-proto 把 gen/ 提交进仓，消费方直接拿，不必各自装 protoc/pbjs 工具链），
# pnpm 要用 git 命令去拉它，而 node:*-slim 不带 git。

workflow:
  rules:
    # 有 MR 时只跑 MR 流水线，避免 branch + MR 双跑
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

verify:
  image: harbor.5518game.com:6443/match/node:22-slim-git
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    # 拉私有契约仓 kit-proto 用**本次 job 的令牌**，不放长期密钥：
    # 读权限由 kit-proto 侧的 CI_JOB_TOKEN inbound allowlist 授予（那边加了本项目 id=49）。
    # 撤销就是从那个白名单里删一行，本仓不留任何凭据。
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@hlgit.5518game.com/".insteadOf "https://hlgit.5518game.com/"
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
  script:
    - pnpm typecheck
    - pnpm build
    - pnpm coverage
    - pnpm lint
    # 渠道表 ↔ 能力目录。**不是**「CI 跑全 flavor 的 assemble」（ADR-0021 的纪律）。
    # 那条现在做不到，但**不是因为网络** —— 拦路的是 Cocos Creator：gradle 要的
    # `apps/demo/build/android/proj/` 是 Creator 的构建产物、不入库，其中 settings.gradle
    # 还把 `:libcocos` 指向 Creator 安装目录。没有 Creator，gradle 连 configure 都过不去。
    # （网络这半已在 2026-09-07 实测排除：`aigc` runner 出得了网，Maven Central / Google
    #  Maven / Gradle 发行版 / Android SDK 仓库全可达；公共镜像走 `docker.m.daocloud.io/` 前缀。）
    # 这道闸只挡它能挡的那一类：表里写了 report:'bugly' 却没建 src/cap-report-bugly/ ——
    # gradle 对不存在的 srcDir 不报错，那个渠道会静默地没有实现。
    - pnpm check:channels
    # core 的 API 文档是 typedoc 生成物且入库（本实例未配 GitLab Pages，Pages 域名还是
    # 默认的 example.com，HTML artifact 也因此不能在线渲染 → 只有入库的 md 能在 GitLab 上直接看）。
    # 这里不推回仓库，只挡「生成物与代码不同步」：本地 pnpm docs:api 后一起提交。
    - pnpm docs:api
    - test -z "$(git status --porcelain -- packages/core/docs/api)" || { git status --short -- packages/core/docs/api; git --no-pager diff -- packages/core/docs/api; echo 'API 文档过期：本地跑 pnpm docs:api 并把 packages/core/docs/api 一起提交'; exit 1; }
    # 协议模块段是**拷进 assets 的**（走 npm import 会被 Cocos 打进 AOT 层，见 ADR-0012），
    # 而漏拷是静默的：旧协议还在、编译照过、线上错发。同上一门的套路，重跑同步脚本比工作树。
    - pnpm proto:sync
    - test -z "$(git status --porcelain -- 'apps/*/assets/**/*-proto.ts')" || { git status --short -- 'apps/*/assets/**/*-proto.ts'; echo '协议模块段与 @kit/proto 不同步：本地跑 pnpm proto:sync 并一起提交'; exit 1; }
  # 从 v8 text reporter 的 "All files | xx.xx |" 抓 core 总覆盖率
  coverage: '/All files\s*\|\s*([\d.]+)/'
