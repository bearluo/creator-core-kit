# creator-core-kit CI —— 两个 job：
#   verify         六门（typecheck / build / test(coverage) / lint / channels / api-docs），共享 docker runner
#   android-flavors 全 flavor 的 Android 编译（ADR-0021 决策 2），mac runner，见文件末尾
#
# 铁律由 lint 强制执行（core 禁 import 'cc'，规则见 eslint.config.js / CLAUDE.md）。
# runner：hlgit 共享 docker runner（linux/amd64，run_untagged=true，故不加 tags）。
# node 22 而非 20：pnpm 11.3.0 在 node 20 上启动即崩（ERR_UNKNOWN_BUILTIN_MODULE）。
#
# 镜像走内网 Harbor 而不是 docker.io：**runner 没有公网**，直连 registry-1.docker.io
# 每次 30s 超时 ×2 后整个 job 失败（连 clone 都到不了）。基础镜像已搬运到
# harbor.huanchanghuyu.com/match/，与 remove-bg-api 等仓同一套路；拉取凭据是项目
# CI/CD Variable `DOCKER_AUTH_CONFIG`（match 只读 robot，不入库）。
# 换 node 版本要先把新 tag 推进 Harbor，否则同样拉不到。
#
# `-git` 后缀的镜像 = node:22-slim + git。协议契约 `@kit/proto` 是 **git 依赖**
# （kit-proto 把 gen/ 提交进仓，消费方直接拿，不必各自装 protoc/pbjs 工具链），
# pnpm 要用 git 命令去拉它，而 node:*-slim 不带 git。

workflow:
  rules:
    # 有 MR 时只跑 MR 流水线，避免 branch + MR 双跑
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

verify:
  image: harbor.huanchanghuyu.com/match/node:22-slim-git
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    # 拉私有契约仓 kit-proto 用**本次 job 的令牌**，不放长期密钥：
    # 读权限由 kit-proto 侧的 CI_JOB_TOKEN inbound allowlist 授予（那边加了本项目 id=49）。
    # 撤销就是从那个白名单里删一行，本仓不留任何凭据。
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.huanchanghuyu.com/".insteadOf "https://gitlab.huanchanghuyu.com/"
    - corepack enable
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
  script:
    - pnpm typecheck
    - pnpm build
    - pnpm coverage
    - pnpm lint
    # 渠道表 ↔ 能力目录。它**不是**「CI 跑全 flavor 的 assemble」（那是下面的 android-flavors），
    # 只挡自己那一类：表里写了 report:'bugly' 却没建 src/cap-report-bugly/ —— gradle 对不存在的
    # srcDir 不报错，那个渠道会静默地没有实现。秒级，所以放在这里每次 push 都跑。
    - pnpm check:channels
    # core 的 API 文档是 typedoc 生成物且入库（本实例未配 GitLab Pages，Pages 域名还是
    # 默认的 example.com，HTML artifact 也因此不能在线渲染 → 只有入库的 md 能在 GitLab 上直接看）。
    # 这里不推回仓库，只挡「生成物与代码不同步」：本地 pnpm docs:api 后一起提交。
    - pnpm docs:api
    - test -z "$(git status --porcelain -- packages/core/docs/api)" || { git status --short -- packages/core/docs/api; git --no-pager diff -- packages/core/docs/api; echo 'API 文档过期：本地跑 pnpm docs:api 并把 packages/core/docs/api 一起提交'; exit 1; }
    # 协议模块段是**拷进 assets 的**（走 npm import 会被 Cocos 打进 AOT 层，见 ADR-0012），
    # 而漏拷是静默的：旧协议还在、编译照过、线上错发。同上一门的套路，重跑同步脚本比工作树。
    - pnpm proto:sync
    - test -z "$(git status --porcelain -- 'apps/*/assets/**/*-proto.ts')" || { git status --short -- 'apps/*/assets/**/*-proto.ts'; echo '协议模块段与 @kit/proto 不同步：本地跑 pnpm proto:sync 并一起提交'; exit 1; }
  # 从 v8 text reporter 的 "All files | xx.xx |" 抓 core 总覆盖率
  coverage: '/All files\s*\|\s*([\d.]+)/'

# —— 全 flavor 的 Android 编译（ADR-0021 决策 2）——
#
# 跑在 **mac** 上，不是容器里：Cocos Creator **没有 Linux 版编辑器**（官方安装文档的系统要求
# 只有 Windows / macOS，命令行发布文档也只给这两个可执行文件路径），而 gradle 要的
# `apps/demo/build/android/proj/` 是 Creator 的构建产物、不入库，其中 settings.gradle 还把
# `:libcocos` 指向 Creator 安装目录。没有 Creator，gradle 连 configure 都过不去。
# 宿主与 runner 的搭建记在 hlgit #53。
#
# 只在 MR 与主干上跑：一次要编 Cocos 引擎的 C++（704 个目标文件），不是每次 push 都值得。
# 它挡的是「改了公共代码把某个 flavor 编坏了，本地选着 dev 一无所知」，在合入前挡住就够。
# 纯文档提交连这个也跳过 —— 判据见下面那份白名单。
# 「改了什么才值得重编一次 Android」的白名单。**写成「除 `docs/` 之外的一切」，
# 不是「列出所有会影响构建的路径」** —— 后者漏一条的后果是「该跑的没跑」，而且是静默的：
# 流水线全绿、MR 可以合，某个 flavor 编坏了却没人知道。这个方向反过来，漏了只会多跑一次。
#
# `*` / `.*` 是根目录那一层（`package.json` / `pnpm-lock.yaml` / `.gitlab-ci.yml` …）——
# GitLab 的 glob 里 `*` 不跨 `/`，所以它不会把 `docs/x.md` 一起吃进来。
#
# ⚠️ 只挡得住**顶层** `docs/`。随包 / 随工程的文档（`packages/*/docs/`、`apps/*/docs/`）
# 仍会触发 —— 那是刻意的：doc-as-code 要求它们跟代码同一个提交，本来就该跟着跑。
.android-build-affecting: &android-build-affecting
  - "*"
  - ".*"
  - "apps/**/*"
  - "packages/**/*"
  - "scripts/**/*"

android-flavors:
  tags: [cocos-mac]
  needs: []
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *android-build-affecting
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *android-build-affecting
  variables:
    # **不加 `-x`**（默认是 `-ffdx`）：留住 gitignore 的 apps/demo/{library,build}/ 与 node_modules/。
    # 全清一次 = Creator 重导全部资源 + NDK 从零重编整个引擎，十几分钟起步；留着则是增量。
    # 代价是产物可能陈旧，所以这台 runner 只跑这一个 job（concurrent = 1）。
    GIT_CLEAN_FLAGS: -ffd
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    # 把「全局」git 配置挪进 job 目录，**别碰宿主的 ~/.gitconfig**。docker executor 里
    # HOME 是一次性的，shell executor 里它是那台机上真实的家目录，而这台 mac 是有人用的：
    # 它的 ~/.gitconfig 配着 `credential.helper = store`，clone 用的 job token 会被原样
    # 写进共享的明文 ~/.git-credentials。设成 job 变量（而不是 before_script 里 export）
    # 是因为 runner **自己那次 clone** 发生在 before_script 之前。
    GIT_CONFIG_GLOBAL: "$CI_PROJECT_DIR/.git-ci-config"
  before_script:
    # shell executor 起的是**非登录** bash，不会自动读 ~/.bash_profile —— JAVA_HOME /
    # ANDROID_HOME / node 的 PATH 都在那里面。
    - source ~/.bash_profile
    # 拉私有契约仓 kit-proto 用本次 job 的令牌（同 verify）。落点是上面那份 job 内配置。
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.huanchanghuyu.com/".insteadOf "https://gitlab.huanchanghuyu.com/"
    - corepack enable
    - pnpm install --frozen-lockfile
    # 本机路径（Creator / SDK / NDK / JDK）不入库，常驻宿主 ~/ci/。放 checkout 里没用 ——
    # 它是 gitignore 的文件，会被 git clean 掉。
    - cp ~/ci/local.json apps/demo/build-configs/local.json
  script:
    - pnpm build
    - node apps/demo/scripts/build.mjs boot
    # 有 productFlavors 之后 `assembleDebug` 的语义正是「编**所有** flavor 的 debug」——
    # 出包时这是坑（分不清出来的是哪个包，见 build.mjs），当闸时它恰好就是要的那件事。
    - cd apps/demo/build/android/proj && ./gradlew assembleDebug --console=plain
    # 产物侧的闸：每个 flavor 真的编出了它那份能力实现吗（而且是**那一家**的）。
    # `check:channels` 只比对「表 ↔ 目录」，看不见 gradle 到底把哪些文件喂给了 javac ——
    # 而那一环出过两次静默事故：能力目录被 main 的源根整个吞掉（三份编进每个 flavor），
    # 以及 AGP 增量陈旧（任务报 UP-TO-DATE、构建全绿、产物里一个 CckReport.class 都没有）。
    # 后者正是 `GIT_CLEAN_FLAGS: -ffd` 换来的速度所附带的风险，所以这道闸不是可选项。
    - cd "$CI_PROJECT_DIR" && node apps/demo/scripts/check-flavor-classes.mjs
  after_script:
    - rm -f "$CI_PROJECT_DIR/.git-ci-config"
  artifacts:
    when: on_failure
    paths:
      - apps/demo/temp/build-configs/*.log
    expire_in: 1 week
